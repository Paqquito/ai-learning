<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Identité vérifiée, accès contrôlé</title><desc id="desc">La personne s'authentifie auprès du fournisseur d'identité. Le backend utilise un contexte d'identité vérifié pour demander un document. L'API contrôle action et ressource, puis autorise ou refuse.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#637068"/></marker></defs><rect width="800" height="560" rx="16" fill="#fffefa"/><g font-family="system-ui,sans-serif" fill="#24382f"><text x="32" y="42" font-size="23" font-weight="700">Identité vérifiée, accès contrôlé</text><g><rect x="35" y="85" width="260" height="120" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="2"/><text x="51" y="117" font-size="20" font-weight="700" fill="#285b82">Utilisateur</text><text x="51" y="147" font-size="17">Droits sur Alpha</text><text x="51" y="171" font-size="17">Aucun droit sur Beta</text></g><g><rect x="500" y="85" width="260" height="120" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="2"/><text x="516" y="117" font-size="20" font-weight="700" fill="#654681">Identité</text><text x="516" y="147" font-size="17">Authentifier</text><text x="516" y="171" font-size="17">Délégation selon le flux</text></g><g><rect x="35" y="330" width="260" height="120" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="2"/><text x="51" y="362" font-size="20" font-weight="700" fill="#245b48">Backend</text><text x="51" y="392" font-size="17">Identité vérifiée</text><text x="51" y="416" font-size="17">Pas de rôle libre</text></g><g><rect x="500" y="330" width="260" height="120" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="2"/><text x="516" y="362" font-size="20" font-weight="700" fill="#99502b">API documentaire</text><text x="516" y="392" font-size="17">Action + ressource</text><text x="516" y="416" font-size="17">Alpha oui / Beta non</text></g><path d="M295 145H500" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="316" y="125" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Authentification</text><path d="M500 190L295 355" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="340" y="260" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Contexte vérifié</text><path d="M165 205V330" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="275" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Demande</text><path d="M295 395H500" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="318" y="377" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Accès à contrôler</text><text x="32" y="538" font-size="14" fill="#637068">Architecture pédagogique · exemples fictifs · flèches = échanges ou transitions</text></g></svg>
