<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Sélectionner l'entrée, réserver la sortie</title><desc id="desc">Le harness choisit instructions, historique et preuves pertinentes. Les éléments obsolètes ou inutiles sont écartés. L'entrée respecte le budget qui réserve également sortie et marge.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#637068"/></marker></defs><rect width="800" height="560" rx="16" fill="#fffefa"/><g font-family="system-ui,sans-serif" fill="#24382f"><text x="32" y="42" font-size="23" font-weight="700">Sélectionner l'entrée, réserver la sortie</text><g><rect x="35" y="85" width="330" height="120" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="2"/><text x="51" y="117" font-size="20" font-weight="700" fill="#285b82">Informations disponibles</text><text x="51" y="147" font-size="17">Instructions et outils</text><text x="51" y="171" font-size="17">Historique et documents</text></g><g><rect x="460" y="85" width="300" height="120" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="2"/><text x="476" y="117" font-size="20" font-weight="700" fill="#654681">Sélection du harness</text><text x="476" y="147" font-size="17">Pertinence + droits</text><text x="476" y="171" font-size="17">Contraintes préservées</text></g><g><rect x="35" y="340" width="330" height="120" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="2"/><text x="51" y="372" font-size="20" font-weight="700" fill="#99502b">Éléments écartés</text><text x="51" y="402" font-size="17">Doublons et résultats périmés</text><text x="51" y="426" font-size="17">Pas de suppression aveugle</text></g><g><rect x="460" y="340" width="300" height="120" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="2"/><text x="476" y="372" font-size="20" font-weight="700" fill="#245b48">Budget de l'exemple</text><text x="476" y="402" font-size="17">Entrée ≤ 13 000</text><text x="476" y="426" font-size="17">Sortie 2 000 + marge 1 000</text></g><path d="M365 145H460" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="383" y="127" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Trier</text><path d="M610 205V340" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="625" y="270" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Conserver</text><path d="M460 195L365 340" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="350" y="265" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Écarter</text><text x="32" y="538" font-size="14" fill="#637068">Architecture pédagogique · exemples fictifs · flèches = échanges ou transitions</text></g></svg>
