<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Que cachent 86 % de bonnes réponses ?</title><desc id="desc">Lignes réalité, colonnes prédiction. 12 vrais positifs, 8 faux négatifs, 6 faux positifs, 74 vrais négatifs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#627769"/></marker></defs><rect width="900" height="620" fill="#fffefa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="25" font-weight="700" fill="#1e3029">Que cachent 86 % de bonnes réponses ?</text><text x="280" y="95" font-size="15" font-weight="650" fill="#1e3029">PRÉDICTION</text><text x="290" y="130" font-size="19" font-weight="650" fill="#1e3029">Urgent</text><text x="590" y="130" font-size="19" font-weight="650" fill="#1e3029">Ordinaire</text><text x="30" y="210" font-size="14" font-weight="650" fill="#1e3029">RÉALITÉ</text><text x="30" y="245" font-size="19" font-weight="650" fill="#1e3029">Urgent</text><text x="30" y="410" font-size="19" font-weight="650" fill="#1e3029">Ordinaire</text><rect x="250" y="160" width="270" height="140" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="266" y="189" font-size="19" font-weight="650" fill="#245b48">12 vrais positifs</text><text x="266" y="218" font-size="16" font-weight="400" fill="#1e3029">Urgences détectées</text><rect x="550" y="160" width="300" height="140" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="566" y="189" font-size="19" font-weight="650" fill="#99502b">8 faux négatifs</text><text x="566" y="218" font-size="16" font-weight="400" fill="#1e3029">Urgences manquées</text><rect x="250" y="335" width="270" height="140" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="266" y="364" font-size="19" font-weight="650" fill="#99502b">6 faux positifs</text><text x="266" y="393" font-size="16" font-weight="400" fill="#1e3029">Fausses alertes</text><rect x="550" y="335" width="300" height="140" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="566" y="364" font-size="19" font-weight="650" fill="#245b48">74 vrais négatifs</text><text x="566" y="393" font-size="16" font-weight="400" fill="#1e3029">Ordinaires bien classées</text><text x="250" y="530" font-size="19" font-weight="650" fill="#285b82">Précision : 12/18 = 66,7 %</text><text x="250" y="565" font-size="19" font-weight="650" fill="#654681">Rappel : 12/20 = 60 %</text><text x="30" y="600" font-size="12" font-weight="400" fill="#526459">Schéma pédagogique · exemples fictifs · flèches = échanges ou transformations</text></g></svg>
