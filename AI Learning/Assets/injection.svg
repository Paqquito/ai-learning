<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Une donnée ne donne pas une permission</title><desc id="desc">Le document non fiable peut influencer le modèle. Des contrôles indépendants limitent les actions proposées.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#627769"/></marker></defs><rect width="900" height="620" fill="#fffefa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="25" font-weight="700" fill="#1e3029">Une donnée ne donne pas une permission</text><rect x="30" y="90" width="250" height="130" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="46" y="119" font-size="19" font-weight="650" fill="#99502b">Document consulté</text><text x="46" y="148" font-size="16" font-weight="400" fill="#1e3029">Source externe ou interne</text><text x="46" y="172" font-size="16" font-weight="400" fill="#1e3029">Contenu potentiellement</text><text x="46" y="196" font-size="16" font-weight="400" fill="#1e3029">hostile</text><path d="M280 155H335" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="335" y="90" width="240" height="130" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="351" y="119" font-size="19" font-weight="650" fill="#285b82">Modèle</text><text x="351" y="148" font-size="16" font-weight="400" fill="#1e3029">Lit le contexte</text><text x="351" y="172" font-size="16" font-weight="400" fill="#1e3029">Propose une action</text><path d="M575 155H630" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="630" y="90" width="240" height="130" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="646" y="119" font-size="19" font-weight="650" fill="#654681">Contrôles serveur</text><text x="646" y="148" font-size="16" font-weight="400" fill="#1e3029">Schéma + identité</text><text x="646" y="172" font-size="16" font-weight="400" fill="#1e3029">Droits + destination</text><path d="M750 220V290" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="560" y="290" width="310" height="100" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="576" y="319" font-size="19" font-weight="650" fill="#245b48">Action autorisée</text><text x="576" y="348" font-size="16" font-weight="400" fill="#1e3029">Seulement dans le périmètre</text><text x="576" y="372" font-size="16" font-weight="400" fill="#1e3029">de la tâche et des permissions.</text><path d="M630 185H605V340H500" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="130" y="290" width="370" height="100" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="146" y="319" font-size="19" font-weight="650" fill="#99502b">Sinon : refus contrôlé</text><text x="146" y="348" font-size="16" font-weight="400" fill="#1e3029">Pas d’exécution ni de transfert.</text><rect x="30" y="455" width="840" height="95" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="46" y="484" font-size="19" font-weight="650" fill="#285b82">Vérifier les effets réels</text><text x="46" y="513" font-size="16" font-weight="400" fill="#1e3029">Réponse + appels d’outils + traces réseau ; pas seulement le texte final.</text><text x="30" y="600" font-size="12" font-weight="400" fill="#526459">Schéma pédagogique · exemples fictifs · flèches = échanges ou transformations</text></g></svg>
