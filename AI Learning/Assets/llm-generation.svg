<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Des tokens aux tokens suivants</title><desc id="desc">La tokenisation produit des identifiants. Le modèle calcule des scores, le décodage choisit un token et la boucle recommence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#627769"/></marker></defs><rect width="900" height="620" fill="#fffefa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="25" font-weight="700" fill="#1e3029">Des tokens aux tokens suivants</text><rect x="30" y="90" width="240" height="125" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="46" y="119" font-size="19" font-weight="650" fill="#285b82">Contexte</text><text x="46" y="148" font-size="16" font-weight="400" fill="#1e3029">Consignes + demande</text><text x="46" y="172" font-size="16" font-weight="400" fill="#1e3029">+ données sélectionnées</text><path d="M270 150H330" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="330" y="90" width="240" height="125" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="346" y="119" font-size="19" font-weight="650" fill="#654681">Tokenisation</text><text x="346" y="148" font-size="16" font-weight="400" fill="#1e3029">Texte → identifiants</text><text x="346" y="172" font-size="16" font-weight="400" fill="#1e3029">Dépend du tokenizer</text><path d="M570 150H630" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="630" y="90" width="240" height="125" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="646" y="119" font-size="19" font-weight="650" fill="#245b48">Modèle</text><text x="646" y="148" font-size="16" font-weight="400" fill="#1e3029">Poids utilisés en inférence</text><text x="646" y="172" font-size="16" font-weight="400" fill="#1e3029">Scores des tokens suivants</text><path d="M750 215V305" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="630" y="305" width="240" height="125" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="646" y="334" font-size="19" font-weight="650" fill="#654681">Décodage</text><text x="646" y="363" font-size="16" font-weight="400" fill="#1e3029">Choisir le prochain token</text><text x="646" y="387" font-size="16" font-weight="400" fill="#1e3029">Selon la configuration</text><path d="M630 365H570" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="330" y="305" width="240" height="125" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="346" y="334" font-size="19" font-weight="650" fill="#285b82">Contexte augmenté</text><text x="346" y="363" font-size="16" font-weight="400" fill="#1e3029">Ajouter le token produit</text><text x="346" y="387" font-size="16" font-weight="400" fill="#1e3029">Continuer ou s’arrêter</text><path d="M450 305V250H750V215" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="30" y="485" width="840" height="80" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="46" y="514" font-size="19" font-weight="650" fill="#99502b">Plausible ne signifie pas vérifié</text><text x="46" y="543" font-size="16" font-weight="400" fill="#1e3029">La génération n’est ni une consultation automatique du Web ni un accès à tes fichiers.</text><text x="30" y="600" font-size="12" font-weight="400" fill="#526459">Schéma pédagogique · exemples fictifs · flèches = échanges ou transformations</text></g></svg>
