<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Résoudre un nom, puis joindre le service</title><desc id="desc">L'application demande une adresse au DNS. La connexion vers l'API passe ensuite par la route et les contrôles réseau ; le DNS ne transporte pas les messages au modèle.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#637068"/></marker></defs><rect width="800" height="560" rx="16" fill="#fffefa"/><g font-family="system-ui,sans-serif" fill="#24382f"><text x="32" y="42" font-size="23" font-weight="700">Résoudre un nom, puis joindre le service</text><g><rect x="35" y="90" width="260" height="120" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="2"/><text x="51" y="122" font-size="20" font-weight="700" fill="#285b82">Application</text><text x="51" y="152" font-size="17">Nom du service</text><text x="51" y="176" font-size="17">Port et chemin HTTP</text></g><g><rect x="500" y="90" width="260" height="120" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="2"/><text x="516" y="122" font-size="20" font-weight="700" fill="#654681">DNS</text><text x="516" y="152" font-size="17">Nom → adresse IP</text><text x="516" y="176" font-size="17">Ex. : 10.20.0.15</text></g><g><rect x="35" y="340" width="260" height="120" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="2"/><text x="51" y="372" font-size="20" font-weight="700" fill="#99502b">Chemin réseau</text><text x="51" y="402" font-size="17">Passerelle / route</text><text x="51" y="426" font-size="17">Pare-feu : autoriser ?</text></g><g><rect x="500" y="340" width="260" height="120" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="2"/><text x="516" y="372" font-size="20" font-weight="700" fill="#245b48">API de modèle</text><text x="516" y="402" font-size="17">Service à l'écoute</text><text x="516" y="426" font-size="17">Contrôles applicatifs</text></g><path d="M295 120H500" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="315" y="103" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">1. Demande DNS</text><path d="M500 195H295" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="335" y="220" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">2. Adresse</text><path d="M165 210V340" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="280" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">3. Connexion</text><path d="M295 400H500" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="335" y="382" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">4. IP + port</text><text x="32" y="538" font-size="14" fill="#637068">Architecture pédagogique · exemples fictifs · flèches = échanges ou transitions</text></g></svg>
