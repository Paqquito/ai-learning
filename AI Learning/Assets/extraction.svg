<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">Un JSON valide peut contenir une erreur</title><desc id="desc">Les trois contrôles portent sur des propriétés différentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63776f"/></marker></defs><rect width="900" height="550" fill="#fafbf7"/><g font-family="system-ui, sans-serif"><text x="30" y="38" font-size="25" font-weight="700" fill="#1f4035">Un JSON valide peut contenir une erreur</text><text x="30" y="68" font-size="16" fill="#4e645b">Les trois contrôles portent sur des propriétés différentes.</text><rect x="30" y="110" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="48" y="140" fill="#285b82" font-size="18" font-weight="700">1. Syntaxe</text><text x="48" y="167" font-size="15" fill="#263b36">Le JSON est-il lisible ?</text><text x="48" y="189" font-size="15" fill="#263b36">Virgules, guillemets…</text><rect x="325" y="110" width="250" height="104" rx="12" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="343" y="140" fill="#654681" font-size="18" font-weight="700">2. Schéma</text><text x="343" y="167" font-size="15" fill="#263b36">Types, champs requis</text><text x="343" y="189" font-size="15" fill="#263b36">valeurs null autorisées</text><rect x="620" y="110" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="638" y="140" fill="#285b82" font-size="18" font-weight="700">3. Contenu métier</text><text x="638" y="167" font-size="15" fill="#263b36">Preuve source, montant</text><text x="638" y="189" font-size="15" fill="#263b36">dates et cohérence</text><path d="M280 162H325" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 162H620" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="330" width="250" height="104" rx="12" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="638" y="360" fill="#245b48" font-size="18" font-weight="700">Donnée exploitable</text><text x="638" y="387" font-size="15" fill="#263b36">Contrôles satisfaits</text><text x="638" y="409" font-size="15" fill="#263b36">Provenance conservée</text><rect x="325" y="330" width="250" height="104" rx="12" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="343" y="360" fill="#99502b" font-size="18" font-weight="700">Revue ou réparation</text><text x="343" y="387" font-size="15" fill="#263b36">Erreur ou doute identifié</text><text x="343" y="409" font-size="15" fill="#263b36">Aucune action automatique</text><path d="M745 214V330" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="785" y="278" text-anchor="middle" font-size="14" fill="#42594f">Valide</text><path d="M650 214V270H450V330" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="545" y="260" text-anchor="middle" font-size="14" fill="#42594f">Doute</text><path d="M450 214V330" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><path d="M155 214V382H325" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
