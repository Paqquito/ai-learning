<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Boucle d'apprentissage supervisé</title><desc id="desc">Le modèle utilise les entrées et les poids pour produire une prédiction. La perte la compare à la cible. La rétropropagation calcule des gradients ; l'optimiseur les utilise pour mettre à jour les poids avant le prochain calcul.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#28614c"/></marker></defs>
<rect width="900" height="560" rx="18" fill="#f5f5ed"/>
<g font-family="system-ui,sans-serif" fill="#183c33"><text x="30" y="40" font-size="22" font-weight="bold">Apprendre : prédire, mesurer, dériver, ajuster</text>
<g fill="#fff" stroke="#b5c4b7"><rect x="30" y="100" width="190" height="90" rx="12"/><rect x="300" y="100" width="250" height="90" rx="12"/><rect x="640" y="100" width="230" height="90" rx="12"/><rect x="640" y="285" width="230" height="100" rx="12"/><rect x="300" y="285" width="250" height="100" rx="12"/></g>
<g text-anchor="middle"><g font-size="22"><text x="125" y="140">Entrées</text><text x="425" y="140">Modèle</text><text x="755" y="140">Perte</text><text x="755" y="326">Rétropropagation</text><text x="425" y="326">Optimiseur</text></g><g font-size="15"><text x="125" y="170">Un batch d’exemples</text><text x="425" y="170">Poids actuels</text><text x="755" y="170">Prédiction et cible</text><text x="755" y="358">Calcul des gradients</text><text x="425" y="358">Mise à jour des poids</text></g></g>
<g fill="none" stroke="#28614c" stroke-width="2.5" marker-end="url(#a)"><path d="M220 145H300"/><path d="M550 145H640"/><path d="M755 190V285"/><path d="M640 335H550"/><path d="M300 335H255V215H425V190"/></g>
<text x="565" y="125" font-size="14">Prédiction</text><text x="30" y="440" font-size="18">Le gradient est calculé ; l’optimiseur applique la mise à jour.</text><text x="30" y="478" font-size="17">La validation mesure la généralisation sans apprendre sur ses exemples.</text><text x="30" y="518" font-size="15">Schéma pédagogique : la rétropropagation parcourt les opérations du modèle.</text>
</g></svg>
