<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Traiter, reprendre ou isoler</title><desc id="desc">Une tâche passe de la file au worker. Si elle réussit, le worker accuse réception. Un échec transitoire repart dans une reprise différée. Après la limite de tentatives, la tâche est isolée.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#637068"/></marker></defs><rect width="800" height="560" rx="16" fill="#fffefa"/><g font-family="system-ui,sans-serif" fill="#24382f"><text x="32" y="42" font-size="23" font-weight="700">Traiter, reprendre ou isoler</text><g><rect x="35" y="80" width="260" height="96" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="2"/><text x="51" y="112" font-size="20" font-weight="700" fill="#285b82">File</text><text x="51" y="142" font-size="17">Demandes en attente</text></g><g><rect x="500" y="80" width="260" height="96" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="2"/><text x="516" y="112" font-size="20" font-weight="700" fill="#245b48">Worker</text><text x="516" y="142" font-size="17">Tente le traitement</text></g><g><rect x="35" y="330" width="260" height="120" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="2"/><text x="51" y="362" font-size="20" font-weight="700" fill="#654681">Reprise différée</text><text x="51" y="392" font-size="17">Budget restant</text><text x="51" y="416" font-size="17">Délai + variation</text></g><g><rect x="500" y="330" width="260" height="120" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="2"/><text x="516" y="362" font-size="20" font-weight="700" fill="#99502b">Quarantaine</text><text x="516" y="392" font-size="17">Limite atteinte</text><text x="516" y="416" font-size="17">Examen humain</text></g><path d="M295 120H500" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="350" y="102" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Livraison</text><path d="M500 160H295" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="325" y="192" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Succès → accusé</text><path d="M500 176L295 360" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="315" y="265" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Échec transitoire</text><path d="M165 330V176" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="48" y="265" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Nouvel essai</text><path d="M630 176V330" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="295" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Échecs persistants</text><text x="32" y="538" font-size="14" fill="#637068">Architecture pédagogique · exemples fictifs · flèches = échanges ou transitions</text></g></svg>
