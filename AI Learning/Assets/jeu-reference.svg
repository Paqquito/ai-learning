<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">Séparer le réglage de la décision finale</title><desc id="desc">Garder ensemble les variantes d’un même ticket ou document.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63776f"/></marker></defs><rect width="900" height="550" fill="#fafbf7"/><g font-family="system-ui, sans-serif"><text x="30" y="38" font-size="25" font-weight="700" fill="#1f4035">Séparer le réglage de la décision finale</text><text x="30" y="68" font-size="16" fill="#4e645b">Garder ensemble les variantes d’un même ticket ou document.</text><rect x="30" y="100" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="48" y="130" fill="#285b82" font-size="18" font-weight="700">Situations métier</text><text x="48" y="157" font-size="15" fill="#263b36">Cas fréquents, limites</text><text x="48" y="179" font-size="15" fill="#263b36">et accès interdits</text><rect x="325" y="100" width="250" height="104" rx="12" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="343" y="130" fill="#654681" font-size="18" font-weight="700">Cas annotés</text><text x="343" y="157" font-size="15" fill="#263b36">Entrée, preuve, attendu</text><text x="343" y="179" font-size="15" fill="#263b36">version et relecture</text><rect x="620" y="100" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="638" y="130" fill="#285b82" font-size="18" font-weight="700">Séparation par groupe</text><text x="638" y="157" font-size="15" fill="#263b36">Tickets, clients</text><text x="638" y="179" font-size="15" fill="#263b36">ou périodes</text><path d="M280 152H325" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 152H620" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="320" width="250" height="104" rx="12" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="343" y="350" fill="#654681" font-size="18" font-weight="700">Ensemble de réglage</text><text x="343" y="377" font-size="15" fill="#263b36">Ajuster le système</text><text x="343" y="399" font-size="15" fill="#263b36">Comparer les variantes</text><rect x="620" y="320" width="250" height="104" rx="12" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="638" y="350" fill="#245b48" font-size="18" font-weight="700">Test réservé</text><text x="638" y="377" font-size="15" fill="#263b36">Critères fixés à l’avance</text><text x="638" y="399" font-size="15" fill="#263b36">Résultats par catégorie</text><path d="M690 204V260H450V320" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="250" text-anchor="middle" font-size="14" fill="#42594f">Développement</text><path d="M795 204V320" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="835" y="269" text-anchor="middle" font-size="14" fill="#42594f">Décision</text><rect x="30" y="320" width="250" height="104" rx="12" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="48" y="350" fill="#99502b" font-size="18" font-weight="700">Nouvelle version</text><text x="48" y="377" font-size="15" fill="#263b36">Geler prompt, modèle</text><text x="48" y="399" font-size="15" fill="#263b36">index et paramètres</text><path d="M325 372H280" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
