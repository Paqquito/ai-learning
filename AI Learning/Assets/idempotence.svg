<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" role="img" aria-labelledby="title desc"><title id="title">Une demande logique, une clé stable</title><desc id="desc">Deux tentatives utilisent D-17. La première crée T-92 mais sa réponse est perdue. La seconde retrouve T-92 par la même clé. Une clé différente ne protège pas de la duplication.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#637068"/></marker></defs><rect width="800" height="570" rx="16" fill="#fffefa"/><g font-family="system-ui,sans-serif" fill="#24382f"><text x="32" y="42" font-size="23" font-weight="700">Une demande logique, une clé stable</text><g><rect x="35" y="95" width="280" height="120" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="2"/><text x="51" y="127" font-size="20" font-weight="700" fill="#285b82">Tentative 1</text><text x="51" y="157" font-size="17">Clé D-17</text><text x="51" y="181" font-size="17">Créer le ticket</text></g><g><rect x="475" y="95" width="290" height="120" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="2"/><text x="491" y="127" font-size="20" font-weight="700" fill="#245b48">Service cible</text><text x="491" y="157" font-size="17">Enregistre D-17 → T-92</text><text x="491" y="181" font-size="17">Création protégée</text></g><g><rect x="35" y="350" width="280" height="120" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="2"/><text x="51" y="382" font-size="20" font-weight="700" fill="#654681">Tentative 2</text><text x="51" y="412" font-size="17">Même clé D-17</text><text x="51" y="436" font-size="17">Après résultat incertain</text></g><g><rect x="475" y="350" width="290" height="120" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="2"/><text x="491" y="382" font-size="20" font-weight="700" fill="#245b48">Résultat conservé</text><text x="491" y="412" font-size="17">Retour de T-92</text><text x="491" y="436" font-size="17">Aucune nouvelle création</text></g><path d="M315 140H475" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="125" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Créer</text><path d="M475 195H315" fill="none" stroke="#99502b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="225" font-size="16" fill="#99502b" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Réponse perdue ×</text><path d="M175 215V350" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="190" y="290" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Reprendre</text><path d="M315 408H475" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="345" y="390" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Retrouver</text><path d="M620 215V350" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="635" y="285" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Clé déjà connue</text><text x="32" y="548" font-size="14" fill="#637068">Architecture pédagogique · exemples fictifs · flèches = échanges ou transitions</text></g></svg>
