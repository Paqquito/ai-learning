<g font-family="sans-serif" font-size="13" fill="#53635d" text-anchor="middle"><text x="145" y="174">Texte synthétique</text><text x="485" y="174">Données strictement utiles</text><text x="485" y="326">Format + règles métier</text><text x="145" y="326">Corriger ou approuver</text></g>
<g fill="#fff" font-family="sans-serif" text-anchor="middle"><text x="819" y="153" font-size="18">Service de modèle</text><text x="819" y="179" font-size="13">Local ou distant autorisé</text><text x="819" y="423" font-size="18">Créer le ticket</text></g>
