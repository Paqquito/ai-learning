<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Circuit d'une demande de support</title><desc id="desc">Dans l'environnement applicatif, la demande est préparée puis envoyée à un service de modèle autorisé. La proposition revient pour contrôle. Une validation humaine est requise avant de créer un ticket. Un échec revient en traitement manuel.</desc>
