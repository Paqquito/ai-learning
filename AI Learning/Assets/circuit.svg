<rect x="24" y="65" width="605" height="405" rx="12" fill="none" stroke="#9baea2" stroke-dasharray="7 5"/>
<text x="42" y="93" font-family="sans-serif" font-size="14" fill="#53635d">Environnement applicatif</text>
