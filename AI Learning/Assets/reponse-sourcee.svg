<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" role="img" aria-labelledby="title desc"><title id="title">Une affirmation, une preuve vérifiable</title><desc id="desc">Le lien existe-t-il ? Soutient-il vraiment cette affirmation ?</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63776f"/></marker></defs><rect width="900" height="575" fill="#fafbf7"/><g font-family="system-ui, sans-serif"><text x="30" y="38" font-size="25" font-weight="700" fill="#1f4035">Une affirmation, une preuve vérifiable</text><text x="30" y="68" font-size="16" fill="#4e645b">Le lien existe-t-il ? Soutient-il vraiment cette affirmation ?</text><rect x="325" y="90" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="343" y="120" fill="#285b82" font-size="18" font-weight="700">Passages accessibles</text><text x="343" y="147" font-size="15" fill="#263b36">Identifiant, version</text><text x="343" y="169" font-size="15" fill="#263b36">section et extrait</text><rect x="325" y="255" width="250" height="104" rx="12" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="343" y="285" fill="#654681" font-size="18" font-weight="700">Preuve suffisante ?</text><text x="343" y="312" font-size="15" fill="#263b36">Vérifier portée, date</text><text x="343" y="334" font-size="15" fill="#263b36">et contradictions</text><path d="M450 194V255" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="425" width="250" height="104" rx="12" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="48" y="455" fill="#245b48" font-size="18" font-weight="700">Réponse sourcée</text><text x="48" y="482" font-size="15" fill="#263b36">Affirmation délimitée</text><text x="48" y="504" font-size="15" fill="#263b36">citation à proximité</text><rect x="325" y="425" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="343" y="455" fill="#285b82" font-size="18" font-weight="700">Clarification</text><text x="343" y="482" font-size="15" fill="#263b36">Une précision peut</text><text x="343" y="504" font-size="15" fill="#263b36">lever l’ambiguïté</text><rect x="620" y="425" width="250" height="104" rx="12" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="638" y="455" fill="#99502b" font-size="18" font-weight="700">Abstention ciblée</text><text x="638" y="482" font-size="15" fill="#263b36">Dire ce qui manque</text><text x="638" y="504" font-size="15" fill="#263b36">sans inventer de règle</text><path d="M370 359V389H155V425" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="155" y="380" text-anchor="middle" font-size="14" fill="#42594f">Oui</text><path d="M450 359V425" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="395" text-anchor="middle" font-size="14" fill="#42594f">Ambiguïté</text><path d="M530 359V389H745V425" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="745" y="380" text-anchor="middle" font-size="14" fill="#42594f">Non</text></g></svg>
