<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">Retrouver, reclasser, sélectionner</title><desc id="desc">Le reranker ne travaille que sur les candidats reçus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63776f"/></marker></defs><rect width="900" height="550" fill="#fafbf7"/><g font-family="system-ui, sans-serif"><text x="30" y="38" font-size="25" font-weight="700" fill="#1f4035">Retrouver, reclasser, sélectionner</text><text x="30" y="68" font-size="16" fill="#4e645b">Le reranker ne travaille que sur les candidats reçus.</text><rect x="30" y="105" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="48" y="135" fill="#285b82" font-size="18" font-weight="700">1. Recherche</text><text x="48" y="162" font-size="15" fill="#263b36">Corpus autorisé</text><text x="48" y="184" font-size="15" fill="#263b36">20 candidats</text><rect x="325" y="105" width="250" height="104" rx="12" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="343" y="135" fill="#654681" font-size="18" font-weight="700">2. Reranking</text><text x="343" y="162" font-size="15" fill="#263b36">Question + passage</text><text x="343" y="184" font-size="15" fill="#263b36">Un score par couple</text><rect x="620" y="105" width="250" height="104" rx="12" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="638" y="135" fill="#245b48" font-size="18" font-weight="700">3. Contexte</text><text x="638" y="162" font-size="15" fill="#263b36">4 passages au plus</text><text x="638" y="184" font-size="15" fill="#263b36">Budget : 1 800 tokens</text><path d="M280 157H325" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 157H620" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="325" width="250" height="104" rx="12" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="48" y="355" fill="#99502b" font-size="18" font-weight="700">Preuve absente ?</text><text x="48" y="382" font-size="15" fill="#263b36">Revoir index, requête</text><text x="48" y="404" font-size="15" fill="#263b36">ou nombre de candidats</text><rect x="325" y="325" width="250" height="104" rx="12" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="343" y="355" fill="#654681" font-size="18" font-weight="700">Preuve mal classée ?</text><text x="343" y="382" font-size="15" fill="#263b36">Comparer les rangs</text><text x="343" y="404" font-size="15" fill="#263b36">avant et après</text><rect x="620" y="325" width="250" height="104" rx="12" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="638" y="355" fill="#99502b" font-size="18" font-weight="700">Preuve perdue ?</text><text x="638" y="382" font-size="15" fill="#263b36">Retirer les doublons</text><text x="638" y="404" font-size="15" fill="#263b36">préserver les exceptions</text><path d="M155 209V325" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 209V325" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 209V325" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
