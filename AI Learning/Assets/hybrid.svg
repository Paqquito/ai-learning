<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Deux recherches, une sélection de passages</title><desc id="desc">La recherche lexicale et la recherche vectorielle fournissent des listes de candidats autorisés, fusionnées avant sélection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#627769"/></marker></defs><rect width="900" height="620" fill="#fffefa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="25" font-weight="700" fill="#1e3029">Deux recherches, une sélection de passages</text><rect x="300" y="80" width="300" height="80" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="316" y="109" font-size="19" font-weight="650" fill="#285b82">Question</text><text x="316" y="138" font-size="16" font-weight="400" fill="#1e3029">« Procédure AX-104 »</text><path d="M375 160V190H195V225" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M525 160V190H705V225" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="50" y="225" width="300" height="115" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="66" y="254" font-size="19" font-weight="650" fill="#245b48">Recherche lexicale</text><text x="66" y="283" font-size="16" font-weight="400" fill="#1e3029">Termes, codes, références</text><text x="66" y="307" font-size="16" font-weight="400" fill="#1e3029">Exemple : classement BM25</text><rect x="550" y="225" width="300" height="115" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="566" y="254" font-size="19" font-weight="650" fill="#654681">Recherche vectorielle</text><text x="566" y="283" font-size="16" font-weight="400" fill="#1e3029">Proximité des représentations</text><text x="566" y="307" font-size="16" font-weight="400" fill="#1e3029">Exemple : reformulations</text><path d="M200 340V375H450V405" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M700 340V375H450" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="300" y="405" width="300" height="90" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="316" y="434" font-size="19" font-weight="650" fill="#285b82">Fusion des candidats</text><text x="316" y="463" font-size="16" font-weight="400" fill="#1e3029">RRF, puis sélection</text><text x="50" y="540" font-size="18" font-weight="650" fill="#99502b">Les droits s’appliquent avant toute exposition non autorisée.</text><text x="50" y="568" font-size="16" font-weight="400" fill="#1e3029">Le reranking éventuel ne peut réordonner que les candidats reçus.</text><text x="30" y="600" font-size="12" font-weight="400" fill="#526459">Schéma pédagogique · exemples fictifs · flèches = échanges ou transformations</text></g></svg>
