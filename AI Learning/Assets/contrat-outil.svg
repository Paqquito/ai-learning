<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title desc"><title id="title">Trois portes avant l'exécution</title><desc id="desc">Les arguments passent par le schéma puis par les droits et les règles métier. Les refus vont vers une erreur contrôlée. Seul un appel validé atteint le service, puis sa sortie est filtrée.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#637068"/></marker></defs><rect width="800" height="620" rx="16" fill="#fffefa"/><g font-family="system-ui,sans-serif" fill="#24382f"><text x="32" y="42" font-size="23" font-weight="700">Trois portes avant l'exécution</text><g><rect x="35" y="80" width="300" height="96" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="2"/><text x="51" y="112" font-size="20" font-weight="700" fill="#285b82">1 · Arguments proposés</text><text x="51" y="142" font-size="17">Sortie du modèle</text></g><g><rect x="35" y="235" width="300" height="96" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="2"/><text x="51" y="267" font-size="20" font-weight="700" fill="#654681">2 · Schéma JSON</text><text x="51" y="297" font-size="17">Types, champs et limites</text></g><g><rect x="35" y="390" width="300" height="96" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="2"/><text x="51" y="422" font-size="20" font-weight="700" fill="#99502b">3 · Droits et métier</text><text x="51" y="452" font-size="17">Utilisateur + ressource</text></g><g><rect x="460" y="235" width="300" height="120" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="2"/><text x="476" y="267" font-size="20" font-weight="700" fill="#99502b">Refus contrôlé</text><text x="476" y="297" font-size="17">Pas d'exécution</text><text x="476" y="321" font-size="17">Erreur exploitable</text></g><g><rect x="460" y="440" width="300" height="120" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="2"/><text x="476" y="472" font-size="20" font-weight="700" fill="#245b48">Outil autorisé</text><text x="476" y="502" font-size="17">Exécution puis</text><text x="476" y="526" font-size="17">contrôle de la sortie</text></g><path d="M185 176V235" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M185 331V390" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="200" y="365" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Valide</text><path d="M335 283H460" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="355" y="267" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Invalide</text><path d="M335 438L460 335" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="365" y="375" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Interdit</text><path d="M335 465H460" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="450" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Permis</text><text x="32" y="598" font-size="14" fill="#637068">Architecture pédagogique · exemples fictifs · flèches = échanges ou transitions</text></g></svg>
