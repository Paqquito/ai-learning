<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">Approuver une action précise, puis la revérifier</title><desc id="desc">La reprise peut rejouer du code : protéger l’effet métier.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63776f"/></marker></defs><rect width="900" height="550" fill="#fafbf7"/><g font-family="system-ui, sans-serif"><text x="30" y="38" font-size="25" font-weight="700" fill="#1f4035">Approuver une action précise, puis la revérifier</text><text x="30" y="68" font-size="16" fill="#4e645b">La reprise peut rejouer du code : protéger l’effet métier.</text><rect x="30" y="95" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="48" y="125" fill="#285b82" font-size="18" font-weight="700">Proposition figée</text><text x="48" y="152" font-size="15" fill="#263b36">Action, contenu, cible</text><text x="48" y="174" font-size="15" fill="#263b36">Version et échéance</text><rect x="325" y="95" width="250" height="104" rx="12" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="343" y="125" fill="#654681" font-size="18" font-weight="700">Décision humaine</text><text x="343" y="152" font-size="15" fill="#263b36">Identité et habilitation</text><text x="343" y="174" font-size="15" fill="#263b36">Accord sur cette version</text><rect x="620" y="95" width="250" height="104" rx="12" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="638" y="125" fill="#285b82" font-size="18" font-weight="700">Revérification</text><text x="638" y="152" font-size="15" fill="#263b36">Droits actifs, contenu</text><text x="638" y="174" font-size="15" fill="#263b36">et accord non expiré</text><path d="M280 147H325" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 147H620" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="597" y="130" text-anchor="middle" font-size="14" fill="#42594f">Accord</text><rect x="325" y="340" width="250" height="104" rx="12" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="343" y="370" fill="#99502b" font-size="18" font-weight="700">Nouvelle proposition</text><text x="343" y="397" font-size="15" fill="#263b36">Contenu changé ou</text><text x="343" y="419" font-size="15" fill="#263b36">validation à renouveler</text><rect x="30" y="340" width="250" height="104" rx="12" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="48" y="370" fill="#99502b" font-size="18" font-weight="700">Arrêt sans action</text><text x="48" y="397" font-size="15" fill="#263b36">Refus ou expiration</text><text x="48" y="419" font-size="15" fill="#263b36">Statut enregistré</text><rect x="620" y="340" width="250" height="104" rx="12" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="638" y="370" fill="#245b48" font-size="18" font-weight="700">Effet idempotent</text><text x="638" y="397" font-size="15" fill="#263b36">Clé stable, déduplication</text><text x="638" y="419" font-size="15" fill="#263b36">Résultat réconciliable</text><path d="M450 199V245H155V340" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="235" text-anchor="middle" font-size="14" fill="#42594f">Refus</text><path d="M745 199V340" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="785" y="274" text-anchor="middle" font-size="14" fill="#42594f">Valide</text><path d="M650 199V290H450V340" fill="none" stroke="#63776f" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="280" text-anchor="middle" font-size="14" fill="#42594f">Changement détecté</text></g></svg>
