<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title desc"><title id="title">Tracer le circuit, pas seulement le modèle</title><desc id="desc">Les composants sont dans un périmètre interne autorisé. Les sorties externes sont interdites dans ce scénario.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#627769"/></marker></defs><rect width="900" height="680" fill="#fffefa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="25" font-weight="700" fill="#1e3029">Tracer le circuit, pas seulement le modèle</text><rect x="20" y="75" width="610" height="550" rx="14" fill="#f2f5ed" stroke="#245b48" stroke-width="2" stroke-dasharray="7 5"/><text x="40" y="103" font-size="15" font-weight="650" fill="#245b48">PÉRIMÈTRE INTERNE AUTORISÉ</text><rect x="45" y="130" width="235" height="95" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="61" y="159" font-size="19" font-weight="650" fill="#285b82">1 · Navigateur</text><text x="61" y="188" font-size="16" font-weight="400" fill="#1e3029">Identité de l’utilisateur</text><path d="M280 176H350" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="350" y="130" width="250" height="95" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="366" y="159" font-size="19" font-weight="650" fill="#245b48">2 · Backend</text><text x="366" y="188" font-size="16" font-weight="400" fill="#1e3029">Identité, droits, outils</text><path d="M475 225V258H160V300" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="185" y="250" font-size="14" font-weight="400" fill="#1e3029">Recherche autorisée</text><rect x="45" y="300" width="235" height="110" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="61" y="329" font-size="19" font-weight="650" fill="#654681">3 · Recherche</text><text x="61" y="358" font-size="16" font-weight="400" fill="#1e3029">Index et embeddings</text><text x="61" y="382" font-size="16" font-weight="400" fill="#1e3029">Passages autorisés</text><path d="M280 355H350" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="286" y="340" font-size="12" font-weight="400" fill="#1e3029">Extraits</text><rect x="350" y="300" width="250" height="110" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="366" y="329" font-size="19" font-weight="650" fill="#245b48">4 · Inférence</text><text x="366" y="358" font-size="16" font-weight="400" fill="#1e3029">Service de modèle</text><text x="366" y="382" font-size="16" font-weight="400" fill="#1e3029">approuvé</text><path d="M585 300V235" fill="none" stroke="#627769" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="495" y="283" font-size="13" font-weight="400" fill="#1e3029">Réponse</text><rect x="45" y="465" width="555" height="110" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="61" y="494" font-size="19" font-weight="650" fill="#285b82">Traces et sauvegardes dans le même périmètre</text><text x="61" y="523" font-size="16" font-weight="400" fill="#1e3029">Minimiser le contenu journalisé ; fixer la conservation.</text><text x="61" y="547" font-size="16" font-weight="400" fill="#1e3029">Vérifier les appels réseau et les services de diagnostic.</text><rect x="665" y="130" width="210" height="125" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="681" y="159" font-size="19" font-weight="650" fill="#99502b">Hors périmètre</text><text x="681" y="188" font-size="16" font-weight="400" fill="#1e3029">API publique</text><text x="681" y="212" font-size="16" font-weight="400" fill="#1e3029">Télémétrie externe</text><text x="681" y="236" font-size="16" font-weight="400" fill="#1e3029">Stockage externe</text><path d="M600 180H660M620 167L643 193M643 167L620 193" stroke="#99502b" stroke-width="3" fill="none"/><text x="670" y="310" font-size="18" font-weight="650" fill="#99502b">Sortie interdite</text><text x="670" y="338" font-size="16" font-weight="400" fill="#1e3029">dans ce scénario.</text><text x="670" y="395" font-size="15" font-weight="400" fill="#1e3029">Architecture fictive.</text><text x="670" y="420" font-size="15" font-weight="400" fill="#1e3029">Aucune description</text><text x="670" y="445" font-size="15" font-weight="400" fill="#1e3029">des systèmes de DS.</text><text x="30" y="660" font-size="12" font-weight="400" fill="#526459">Schéma pédagogique · exemples fictifs · flèches = échanges ou transformations</text></g></svg>
