<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Un passage doit voyager avec son contexte</title><desc id="desc">Le document est découpé en passages dont la provenance et les droits restent associés.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#627769"/></marker></defs><rect width="900" height="620" fill="#fffefa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="25" font-weight="700" fill="#1e3029">Un passage doit voyager avec son contexte</text><rect x="30" y="85" width="250" height="125" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="46" y="114" font-size="19" font-weight="650" fill="#285b82">Document source</text><text x="46" y="143" font-size="16" font-weight="400" fill="#1e3029">Retours · version 3</text><text x="46" y="167" font-size="16" font-weight="400" fill="#1e3029">Règle + exception</text><text x="46" y="191" font-size="16" font-weight="400" fill="#1e3029">Titre de section</text><path d="M280 147H355" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="291" y="130" font-size="13" font-weight="400" fill="#1e3029">Découper</text><rect x="355" y="85" width="235" height="125" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="1.5"/><text x="371" y="114" font-size="19" font-weight="650" fill="#245b48">Passage autonome</text><text x="371" y="143" font-size="16" font-weight="400" fill="#1e3029">Les deux phrases</text><text x="371" y="167" font-size="16" font-weight="400" fill="#1e3029">restent ensemble.</text><path d="M590 147H665" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="665" y="85" width="205" height="125" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="1.5"/><text x="681" y="114" font-size="19" font-weight="650" fill="#654681">Index</text><text x="681" y="143" font-size="16" font-weight="400" fill="#1e3029">Texte + vecteur</text><text x="681" y="167" font-size="16" font-weight="400" fill="#1e3029">+ métadonnées</text><rect x="355" y="285" width="515" height="140" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="1.5"/><text x="371" y="314" font-size="19" font-weight="650" fill="#285b82">Métadonnées associées</text><text x="371" y="343" font-size="16" font-weight="400" fill="#1e3029">document_id · chunk_id · section · page</text><text x="371" y="367" font-size="16" font-weight="400" fill="#1e3029">version active · date · droits d’accès</text><text x="371" y="391" font-size="16" font-weight="400" fill="#1e3029">Même provenance jusqu’à la citation.</text><path d="M472 285V210" fill="none" stroke="#627769" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="30" y="455" width="840" height="90" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="1.5"/><text x="46" y="484" font-size="19" font-weight="650" fill="#99502b">À vérifier sur de vraies questions</text><text x="46" y="513" font-size="16" font-weight="400" fill="#1e3029">La règle ET son exception sont-elles retrouvées, autorisées et à jour ?</text><text x="30" y="600" font-size="12" font-weight="400" fill="#526459">Schéma pédagogique · exemples fictifs · flèches = échanges ou transformations</text></g></svg>
