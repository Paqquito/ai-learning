<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">TLS : vérifier chaque segment</title><desc id="desc">Un backend se connecte par TLS au reverse proxy, éventuellement via un proxy sortant qui relaie le tunnel. Le reverse proxy termine cette connexion puis ouvre une seconde connexion TLS vers le modèle.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#637068"/></marker></defs><rect width="800" height="560" rx="16" fill="#fffefa"/><g font-family="system-ui,sans-serif" fill="#24382f"><text x="32" y="42" font-size="23" font-weight="700">TLS : vérifier chaque segment</text><g><rect x="35" y="85" width="260" height="120" rx="10" fill="#e6eff8" stroke="#285b82" stroke-width="2"/><text x="51" y="117" font-size="20" font-weight="700" fill="#285b82">Backend</text><text x="51" y="147" font-size="17">Client de l'API</text><text x="51" y="171" font-size="17">Prompt à transmettre</text></g><g><rect x="500" y="85" width="260" height="120" rx="10" fill="#f0eaf7" stroke="#654681" stroke-width="2"/><text x="516" y="117" font-size="20" font-weight="700" fill="#654681">Proxy sortant</text><text x="516" y="147" font-size="17">Optionnel</text><text x="516" y="171" font-size="17">Relais du tunnel ici</text></g><g><rect x="500" y="330" width="260" height="120" rx="10" fill="#fbecdf" stroke="#99502b" stroke-width="2"/><text x="516" y="362" font-size="20" font-weight="700" fill="#99502b">Reverse proxy</text><text x="516" y="392" font-size="17">Terminaison TLS</text><text x="516" y="416" font-size="17">Contenu lisible ici</text></g><g><rect x="35" y="330" width="260" height="120" rx="10" fill="#e7f0df" stroke="#245b48" stroke-width="2"/><text x="51" y="362" font-size="20" font-weight="700" fill="#245b48">Service de modèle</text><text x="51" y="392" font-size="17">Nouvelle session TLS</text><text x="51" y="416" font-size="17">Traitement du prompt</text></g><path d="M295 150H500" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="335" y="132" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">Connexion A</text><path d="M630 205V330" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="645" y="268" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">A : TLS relayé</text><path d="M500 395H295" fill="none" stroke="#637068" stroke-width="2.5" marker-end="url(#arrow)"/><text x="306" y="375" font-size="16" fill="#637068" paint-order="stroke" stroke="#fffefa" stroke-width="6" stroke-linejoin="round">B : autre session TLS</text><text x="32" y="538" font-size="14" fill="#637068">Architecture pédagogique · exemples fictifs · flèches = échanges ou transitions</text></g></svg>
